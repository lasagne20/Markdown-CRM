# Configuration de la classe Personne
name: Personne
icon: 👤
description: Gestion des personnes liées à des institutions
template: Personne.md

# Propriété parent pour organisation automatique des fichiers
parents:
  - property: postes
    folder: Personnes

  - property: institution
    folder: Contacts

populate:
  - property: postes
    title: "Choisir une institution"
    required: true

  - property: statut
    title: "Choisir un statut"

# Configuration des propriétés
properties:
  id:
    type: IdProperty
    title: Identifiant unique
    icon: 🔑
    static: true
    tooltip: "Identifiant unique généré automatiquement"
    
  nom:
    type: Property
    title: Nom complet
    icon: 📝
    required: true
    defaultValue: ""
    tooltip: "Nom de famille de la personne"
    
  prenom:
    type: TextProperty
    title: Prénom
    icon: 👤
    required: false
    defaultValue: ""
    tooltip: "Prénom de la personne"
    
  institution:
    type: FileProperty
    title: Institution
    aliases: ["Institution"]
    icon: 🏢
    tooltip: "Institution de rattachement principal"
    required: false
    defaultValue: ""
    
    classes:
      - Institution
    
  postes:
    type: ObjectProperty
    title: Poste/Fonction
    icon: 💼
    required: false
    defaultValue: {}
    aliases: ["Postes"]
    properties:
      institution:
        type: FileProperty
        title: Institution
        aliases: ["Institution"]
        icon: 🏢
        required: false
        classes:
          - Institution
          - Lieu

      poste:
        type: TextProperty
        title: Poste
        aliases: ["Poste"]
        icon: 💼
        required: false
        defaultValue: ""
    
  email:
    type: EmailProperty
    title: Email professionnel
    tooltip: "Adresse e-mail professionnelle de la personne"
    icon: 📧
    required: false
    defaultValue: ""
    validation:
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      message: "Veuillez entrer une adresse e-mail valide"
    
  telephone:
    type: PhoneProperty
    title: Téléphone
    icon: 📞
    required: false
    defaultValue: ""
    
  statut:
    type: SelectProperty
    title: Statut
    icon: 🏷️
    required: false
    defaultValue: Actif
    options:
      - Actif
      - Inactif
      - En congé
      - Parti

  relation:
    type: SelectProperty
    title: Relation
    icon: 🔗
    options:
      - Client
      - Fournisseur
      - Partenaire
      - Salarié
      - Autre


process:
  - name: AutoRenameProcess
    description: Renomme automatiquement le fichier basé sur le statut
    triggers:
      - onCreate
      - onPropertyChange
    conditions: []
    actions:
      - type: RenameFileAction
        template: "{current} - {statut}"

  - name: ClassChangeProcess
    description: Met à jour la classe en fonction de la propriété 'relation'
    triggers:
       - onPropertyChange
    conditions:
        - property: relation
          type: equals
          value: Salarié
    actions:
      - type: UpdateClassAction
        newClass: Salarié
        
# Configuration d'affichage
display:
  items:
    - type: line
      title: "Identité"
      className: "personne-identity-section"
      items:
        - type: property
          name: classe
        - type: property
          name: nom
        - type: property
          name: prenom
        - type: property
          name: institution
    
    - type: tabs
      title: "Informations"
      className: "personne-info-tabs"
      tabs:
        - name: "Professionnel"
          items:
            - type: property
              name: postes
            - type: property
              name: relation
            - type: property
              name: statut
        - name: "Contact"
          items:
            - type: property
              name: email
            - type: property
              name: telephone
  
