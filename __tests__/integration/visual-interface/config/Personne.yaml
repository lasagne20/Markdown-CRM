# Configuration de la classe Personne
name: Personne
icon: 👤
description: Gestion des personnes liées à des institutions
template: Personne.md
autoRename: "{current} - {statut} - {dateEntree}"

# Propriété parent pour organisation automatique des fichiers
parents:
  - property: postes
    folder: Personnes

  - property: institution
    folder: Contacts

populate:
  - property: postes
    title: "Choisir une institution"
    required: true

  - property: statut
    title: "Choisir un statut"

# Configuration des propriétés
properties:
  nom:
    type: Property
    title: Nom complet
    icon: 📝
    required: true
    defaultValue: ""
    
  prenom:
    type: TextProperty
    title: Prénom
    icon: 👤
    required: false
    defaultValue: ""
    
  institution:
    type: FileProperty
    title: Institution
    aliases: ["Institution"]
    icon: 🏢
    required: false
    defaultValue: ""
    
    classes:
      - Institution
    
  postes:
    type: ObjectProperty
    title: Poste/Fonction
    icon: 💼
    required: false
    defaultValue: {}
    properties:
      institution:
        type: FileProperty
        title: Institution
        icon: 🏢
        required: false
        classes:
          - Institution
          - Lieu

      poste:
        type: TextProperty
        title: Poste
        icon: 💼
        required: false
        defaultValue: ""
    
  email:
    type: EmailProperty
    title: Email professionnel
    icon: 📧
    required: false
    defaultValue: ""
    validation:
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      message: "Veuillez entrer une adresse e-mail valide"
    
  telephone:
    type: PhoneProperty
    title: Téléphone
    icon: 📞
    required: false
    defaultValue: ""
    
  dateEntree:
    type: DateProperty
    title: Date d'entrée
    icon: 📅
    required: false
    defaultValue: ""
    
  statut:
    type: SelectProperty
    title: Statut
    icon: 🏷️
    required: false
    defaultValue: "Actif"
    options:
      - "Actif"
      - "Inactif"
      - "En congé"
      - "Parti"
    
  competences:
    type: MultiSelectProperty
    title: Compétences
    icon: 🎯
    required: false
    defaultValue: []
    options:
      - "Management"
      - "Technique"
      - "Communication"
      - "Vente"
      - "Marketing"
      - "Finance"
      - "RH"
      - "Juridique"
    
  notes:
    type: TextProperty
    title: Notes
    icon: 📋
    required: false
    defaultValue: ""
    multiline: true

# Configuration d'affichage
display:
  containers:
    - type: line
      title: "Identité"
      className: "personne-identity-section"
      properties:
        - classe
        - nom
        - prenom
        - institution
    
    - type: tabs
      title: "Informations"
      className: "personne-info-tabs"
      tabs:
        - name: "Professionnel"
          properties:
            - postes
            - dateEntree
            - statut
            - competences
        - name: "Contact"
          properties:
            - email
            - telephone
    
    - type: fold
      foldTitle: "Notes supplémentaires"
      className: "personne-notes-fold"
      properties:
        - notes
