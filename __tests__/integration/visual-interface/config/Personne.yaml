# Configuration de la classe Personne
name: Personne
icon: 👤
description: Gestion des personnes liées à des institutions
template: Personne.md

# Propriété parent pour organisation automatique des fichiers
parents:
  - property: postes
    folder: Personnes

  - property: institution
    folder: Contacts

populate:
  - property: postes
    title: "Choisir une institution"
    required: true

  - property: statut
    title: "Choisir un statut"

# Configuration des propriétés
properties:
  id:
    type: IdProperty
    title: Identifiant unique
    icon: 🔑
    static: true
    tooltip: "Identifiant unique généré automatiquement"
    
  nom:
    type: Property
    title: Nom complet
    icon: 📝
    required: true
    defaultValue: ""
    tooltip: "Nom de famille de la personne"
    
  prenom:
    type: TextProperty
    title: Prénom
    icon: 👤
 
    defaultValue: ""
    tooltip: "Prénom de la personne"
    
  institution:
    type: FileProperty
    title: Institution
    aliases: ["Institution"]
    icon: 🏢
    tooltip: "Institution de rattachement principal"
 
    defaultValue: ""
    
    classes:
      - Institution

  multipleInstitutions:
    type: MultiFileProperty
    title: Institutions associées
    icon: 🏛️
    tooltip: "Sélectionnez plusieurs institutions associées"
    classes:
      - Institution
    
  postes:
    type: ObjectProperty
    title: Poste/Fonction
    icon: 💼
 
    defaultValue: {}
    aliases: ["Postes"]
    properties:
      institution:
        type: ObjectProperty
        title: Institution
        aliases: ["Institution"]
        icon: 🏢
        properties:
          file:
            type: FileProperty
            title: Institution liée
            icon: 🏛️
            tooltip: "Sélectionnez une institution"
            defaultValue: ""
            classes:
              - Institution
              - Lieu
          niveau:
            type: SelectProperty
            title: Niveau hiérarchique
            icon: 📊
            options:
              - Junior
              - Intermédiaire
              - Senior
              - Direction
            defaultValue: Intermédiaire

      poste:
        type: TextProperty
        title: Poste
        aliases: ["Poste"]
        icon: 💼
     
        defaultValue: ""
    
  email:
    type: EmailProperty
    title: Email professionnel
    tooltip: "Adresse e-mail professionnelle de la personne"
    icon: 📧

  heure:
    type: TimeProperty
    title: Heure de contact préférée
    icon: ⏰
 
    defaultValue: ""
    
  telephone:
    type: PhoneProperty
    title: Téléphone
    icon: 📞
 
    defaultValue: ""
    
  statut:
    type: SelectProperty
    title: Statut
    icon: 🏷️
 
    defaultValue: Actif
    options:
      - Actif
      - Inactif
      - En congé
      - Parti

  date:
    type: DateProperty
    title: Date de début
    icon: 📅
    defaultValue: ""

  relation:
    type: SelectProperty
    title: Relation
    icon: 🔗
    options:
      - Client
      - Fournisseur
      - Partenaire
      - Salarié
      - Autre

  evenements:
    type: ObjectProperty
    title: Événements
    icon: 📅
    defaultValue: []
    properties:
      date:
        type: DateProperty
        title: Date
        icon: 📅
      etat:
        type: SelectProperty
        title: État
        icon: 🏷️
        options:
          - name: À planifier
            color: gray
          - name: Confirmé
            color: green
          - name: En cours
            color: yellow
          - name: Terminé
            color: blue
          - name: Annulé
            color: red
      animation:
        type: TextProperty
        title: Animation
        icon: 🎭
      animateurs:
        type: TextProperty
        title: Animateurs
        icon: 👥


process:
  - name: AutoRenameProcess
    description: Renomme automatiquement le fichier basé sur le statut
    triggers:
      - onCreate
      - onPropertyChange
    conditions: []
    actions:
      - type: RenameFileAction
        template: "{current} - {statut}"

  - name: ClassChangeProcess
    description: Met à jour la classe en fonction de la propriété 'relation'
    triggers:
       - onPropertyChange
    conditions:
        - conditionType: PropertyCondition
          property: relation
          operator: equals
          value: Salarié
    actions:
      - type: UpdateClassAction
        newClass: Salarié
        
# Configuration d'affichage
display:
  items:
    - type: line
      title: "Identité"
      className: "personne-identity-section"
      items:
        - type: property
          name: classe
        - type: property
          name: nom
        - type: property
          name: prenom
        - type: property
          name: institution
    
    - type: tabs
      title: "Informations"
      className: "personne-info-tabs"
      tabs:
        - name: "Professionnel"
          items:
            - type: property
              name: postes
              title: "Postes/Fonctions"
            - type: property
              name: relation
            - type: property
              name: statut
              title: "Statut actuel"
            - type: property
              name: evenements
              title: "Événements"
              display: tabs
              displayContainer:
                items:
                  - type: line
                    items:
                      - type: property
                        name: date
                      - type: property
                        name: etat
                      - type: property
                        name: animation
                  - type: line
                    items:
                      - type: property
                        name: animateurs
        - name: "Contact"
          items:
            - type: property
              name: email
            - type: property
              name: telephone

            - type: property
              name: date
              title: "Date de début"
            - type: property
              name: heure
            - type: property
              name: multipleInstitutions
          
