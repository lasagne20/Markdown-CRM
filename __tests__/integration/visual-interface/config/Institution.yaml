# Configuration de la classe Institution
name: Institution
icon: 🏢
description: Gestion des institutions et organisations
template: Institution.md

# Configuration des propriétés
properties:
  id:
    type: IdProperty
    title: Identifiant unique
    icon: 🔑
    static: true
    
  nom:
    type: Property
    title: Nom de l'institution
    icon: 🏢
    required: true
    defaultValue: ""
    
  type:
    type: SelectProperty
    title: Type d'institution
    icon: 🏷️
    required: false
    defaultValue: "Entreprise"
    options:
      - "Entreprise"
      - "Association"
      - "Administration"
      - "École/Université"
      - "Autre"
    
  secteur:
    type: TextProperty
    title: Secteur d'activité
    icon: 💼
    required: false
    defaultValue: ""
    
  siteWeb:
    type: LinkProperty
    title: Site web
    icon: 🌐
    required: false
    defaultValue: ""
    
  adresse:
    type: AdressProperty
    title: Adresse
    icon: 📍
    required: false
    defaultValue: ""
    
  telephonePrincipal:
    type: PhoneProperty
    title: Téléphone principal
    icon: 📞
    required: false
    defaultValue: ""
    
  email:
    type: EmailProperty
    title: Email principal
    icon: 📧
    required: false
    defaultValue: ""
    
  dateCreation:
    type: DateProperty
    title: Date de création
    icon: 📅
    required: false
    defaultValue: ""
    
  nombreEmployes:
    type: NumberProperty
    title: Nombre d'employés
    icon: 👥
    required: false
    defaultValue: 0
    validation:
      min: 0
    
  description:
    type: TextProperty
    title: Description
    icon: 📋
    required: false
    defaultValue: ""
    multiline: true

# Configuration d'affichage
display:
  containers:
    - type: line
      title: "Informations principales"
      className: "institution-info-section"
      properties:
        - nom
        - type
        - secteur
    
    - type: tabs
      title: "Détails"
      className: "institution-details-tabs"
      tabs:
        - name: "Contact"
          properties:
            - siteWeb
            - email
            - telephonePrincipal
            - adresse
        - name: "Informations"
          properties:
            - dateCreation
            - nombreEmployes
            - description
    
    - type: table
      title: "Membres de l'institution"
      className: "members-table"
      source:
        class: Personne
        filter: children
        filterBy:
          statut: ["Actif", "En congé"]
      columns:
        - name: "Fichier"
          propertyName: _fileName
          filter: text
          sort: true
        - name: "Nom"
          propertyName: nom
          filter: text
          sort: true
        - name: "Poste"
          propertyName: poste
          filter: select
          sort: true
        - name: "Statut"
          propertyName: statut
          filter: select
          sort: true
        - name: "Email"
          propertyName: email
          filter: text
          sort: true
        - name: "Téléphone"
          propertyName: telephone
          filter: false
          sort: false
      totals:
        - column: "Nombre de membres"
          formula: count
    
    - type: table
      title: "Projets de l'institution"
      className: "projects-table"
      source:
        class: Projet
        filter: children
      columns:
        - name: "Fichier"
          propertyName: _fileName
          filter: text
          sort: true
        - name: "Nom du projet"
          propertyName: nom
          filter: text
          sort: true
        - name: "Statut"
          propertyName: statut
          filter: select
          sort: true
        - name: "Priorité"
          propertyName: priorite
          filter: false
          sort: true
        - name: "Progression"
          propertyName: pourcentageCompletion
          filter: false
          sort: true
        - name: "Budget"
          propertyName: budget
          filter: false
          sort: true
        - name: "Responsable"
          propertyName: responsable
          filter: text
          sort: true
      totals:
        - column: "Total projets"
          formula: count
        - column: "Total budget"
          formula: sum
          propertyName: budget
