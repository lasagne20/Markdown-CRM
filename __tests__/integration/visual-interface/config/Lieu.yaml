# Configuration de la classe Lieu
name: Lieu
icon: 📍
description: Gestion des lieux géographiques
template: lieu-template

parent:
  property: parent

data:
  - file: geo.json
    dynamic: true

properties:
  nom:
    type: NameProperty
    title: Nom du lieu
    icon: 📝
    required: true
    
  type:
    type: SelectProperty
    title: Type de territoire
    icon: 🗺️
    required: true
    static: true
    options:
      - National
      - Région
      - Département
      - EPCI
      - Commune
        
  code_postal:
    type: Property
    title: Code postal
    icon: 📮
    
  code_insee:
    type: Property
    title: Code INSEE
    icon: 🔢
    
  population:
    type: NumberProperty
    title: Population
    icon: 👥
    format: '0,0'
    
  superficie:
    type: NumberProperty
    title: Superficie
    icon: 📏
    format: '0,0.00'
    unit: km²
    
  parent:
    type: FileProperty
    title: Territoire parent
    icon: 📂
    static: true
    classes:
      - Lieu
      
  adresse:
    type: AdressProperty
    title: Adresse
    icon: 📍
    
  contacts:
    type: MultiFileProperty
    title: Contacts
    icon: 👤
    classes:
      - Personne
      
  institutions:
    type: MultiFileProperty
    title: Institutions
    icon: 🏢
    classes:
      - Institution
      
  projets:
    type: MultiFileProperty
    title: Projets
    icon: 📊
    classes:
      - Projet
      
  site_web:
    type: LinkProperty
    title: Site web
    icon: 🌐
    
  email:
    type: EmailProperty
    title: Email
    icon: 📧
    
  telephone:
    type: PhoneProperty
    title: Téléphone
    icon: 📞
    
  description:
    type: TextProperty
    title: Description
    icon: 📋
    multiline: true
    
  date_creation:
    type: DateProperty
    title: Date de création
    icon: 📅

display:
  items:
    - type: line
      title: "Identification"
      className: "lieu-identity-section"
      items:
        - type: property
          name: nom
        - type: property
          name: type
        - type: property
          name: parent
        
    - type: tabs
      title: "Informations"
      className: "lieu-info-tabs"
      tabs:
        - name: "Général"
          items:
            - type: property
              name: code_postal
            - type: property
              name: code_insee
            - type: property
              name: population
            - type: property
              name: superficie
        - name: "Coordonnées"
          items:
            - type: property
              name: adresse
            - type: property
              name: telephone
            - type: property
              name: email
            - type: property
              name: site_web
        - name: "Relations"
          items:
            - type: property
              name: contacts
            - type: property
              name: institutions
            - type: property
              name: projets
        
    - type: fold
      title: "Description"
      className: "lieu-description-fold"
      items:
        - type: property
          name: description
        - type: property
          name: date_creation

